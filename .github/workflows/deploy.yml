name: Tests et déploiement

# Déclenché à chaque envoi sur master, et manuellement depuis l'onglet Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1. Les tests tournent toujours, même sans serveur configuré.
  # ------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 : `node --test` n'accepte les motifs génériques qu'à partir
      # de Node 21. Avec Node 20, `npm test` échouerait.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install

      - name: Lancer la suite de tests
        run: npm test

      - name: Vérifier que le client compile
        run: npm run build

  # ------------------------------------------------------------------
  # 2. Déploiement de l'API sur le serveur, si les tests passent.
  #
  #    Seule l'API part ici : le site est hébergé par Vercel, qui se
  #    déploie de son côté à partir du même envoi.
  # ------------------------------------------------------------------
  deploy:
    name: Déploiement de l'API
    needs: tests
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Vérifier que le serveur est configuré
        id: check
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Aucun secret SSH_HOST : déploiement ignoré."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Déployer par SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            echo "--- Sauvegarde avant mise à jour ---"
            # Un déploiement est le moment le plus propice à une mauvaise
            # surprise : on part avec une copie fraîche de la base.
            /usr/local/bin/yth-backup.sh || echo "Sauvegarde indisponible, on continue."

            AVANT=$(git rev-parse --short HEAD)

            echo "--- Récupération du code ---"
            git fetch --all --quiet
            git reset --hard origin/master --quiet

            # Le site vit sur Vercel. S'il réapparaissait ici, le serveur se
            # remettrait à le servir au lieu de répondre en API seule.
            rm -rf client

            echo "--- Dépendances ---"
            npm ci --omit=dev --silent

            echo "--- Redémarrage ---"
            sudo -n systemctl restart yourteamhistory
            sleep 6
            sudo -n systemctl is-active yourteamhistory

            echo "--- Vérification ---"
            REPONSE=$(curl -fsS --max-time 15 http://127.0.0.1:3001/api/health)
            echo "$REPONSE"
            echo "$REPONSE" | grep -q '"status":"ok"' || (echo "L'API ne répond pas correctement" && exit 1)

            APRES=$(git rev-parse --short HEAD)
            echo "Déploiement terminé : $AVANT -> $APRES"
