# Reverse proxy nginx pour Foot Manager.
#
# Installation :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/footmanager
#   sudo ln -s /etc/nginx/sites-available/footmanager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remplacer VOTRE-DOMAINE.fr par votre nom de domaine.
# Le HTTPS est ensuite ajouté automatiquement par :
#   sudo certbot --nginx -d VOTRE-DOMAINE.fr -d www.VOTRE-DOMAINE.fr

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE-DOMAINE.fr www.VOTRE-DOMAINE.fr;

    # Les fichiers audio sont volumineux : on autorise un corps de requête
    # confortable et des délais généreux.
    client_max_body_size 32M;

    # Compression : le bundle JS fait ~285 ko, le CSS ~93 ko.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # Les musiques et les fichiers hachés par Vite ne changent jamais :
    # on les met en cache longuement côté navigateur.
    location /music/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
